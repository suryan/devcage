[package]
name = "devcage"
version = "0.5.0"
edition = "2021"
rust-version = "1.74"
description = "Easy isolation for AI agent development — disposable cages for project work"
license = "MIT"
repository = "https://github.com/suryan/devcage"
keywords = ["security", "sandbox", "isolation", "developer-tools", "agents"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "devcage"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Keep test-only deps minimal; prefer std for integration smoke tests.

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
dead_code = "deny"

[lints.clippy]
# Baseline + strictest practical groups for application code.
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Transitive deps often pull multiple versions (e.g. syn); not actionable in app code.
multiple_crate_versions = "allow"

# Selected `restriction` lints (full group is not usable for real apps).
as_conversions = "deny"
dbg_macro = "deny"
else_if_without_else = "deny"
empty_drop = "deny"
empty_structs_with_brackets = "deny"
exit = "deny"
expect_used = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
multiple_inherent_impl = "deny"
panic = "deny"
print_stderr = "allow" # tracing / user-facing CLI diagnostics
print_stdout = "allow" # JSON CLI output on stdout by design
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
str_to_string = "deny"
string_add = "deny"
todo = "deny"
try_err = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unneeded_field_pattern = "deny"
unseparated_literal_suffix = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"

# Pedantic/nursery allowances that fight this codebase shape (document if expanded).
module_name_repetitions = "allow"
missing_errors_doc = "allow" # anyhow::Result surfaces; expand docs as APIs stabilize
missing_panics_doc = "allow"
# Private modules: `pub` is enough; `pub(crate)` is redundant noise.
redundant_pub_crate = "allow"

[profile.release]
lto = true
strip = true
codegen-units = 1
