# Grok sandbox profile for keys-first projects (kernel-enforced).
# Seeded by: devcage grok | devcage init-grok
# Run:        grok --sandbox keys-first
#
# Extends `strict` so reads are limited to the project (CWD) + system paths —
# not the whole home disk (other repos, random files under ~).
# Complements mcp-secret-launcher + mcp-guard + pkg-guard.
# DevCage offline/untrusted still required for hard no-network on macOS.

[profiles.keys-first]
extends = "strict"
# Linux: block child process network. On macOS this is often a no-op (Grok docs).
restrict_network = true

# Extra writable paths used by nested DevCage under sandbox.
read_write = [
  # Session data (devcage grok also sets DEVCAGE_DATA_DIR under $TMPDIR)
]

# Kernel deny: read + write/rename (globs are gitignore-style).
deny = [
  # Project / tree secrets
  "**/.env",
  "**/.env.*",
  "**/local.env",
  "**/*.pem",
  "**/*.p12",
  "**/*.key",
  "**/*id_rsa*",
  "**/*id_ed25519*",
  "**/credentials.json",
  "**/service-account*.json",
  "**/secrets.yaml",
  "**/secrets.yml",
  "**/secrets.toml",

  # Home secret stores (directory + contents)
  "**/.ssh",
  "**/.ssh/**",
  "**/.aws",
  "**/.aws/**",
  "**/.gnupg",
  "**/.gnupg/**",
  "**/.kube",
  "**/.kube/**",
  "**/.docker/config.json",
  "**/.config/gcloud/**",
  "**/.netrc",
  "**/.npmrc",
  "**/.pypirc",

  # macOS keychain-adjacent paths (best-effort; API may still work)
  "**/Library/Keychains/**",
  "**/Library/Keychains",
]
