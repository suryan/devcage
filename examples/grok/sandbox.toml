# Reference / docs copy of the keys-first Grok sandbox profile.
# Runtime seeding (`devcage grok` / `init-grok`) generates this with
# **absolute** tool paths for the current host (Homebrew, ~/.local/bin, Colima).
#
# Do not rely on hand-copying this file alone on a new machine — run:
#   devcage init-grok --force
#
# Extends Grok `strict` + re-opens only tool paths needed for nested DevCage.
# Hard no-network on macOS: still use `devcage run -p offline`.

[profiles.keys-first]
extends = "strict"
restrict_network = true

# Placeholder — real file from `init-grok` lists absolute paths, e.g.:
#   "/opt/homebrew",
#   "/usr/local",
#   "/Users/you/.local/bin",
#   "/Users/you/.grok/bin",
#   "/Users/you/.colima",
#   "/Users/you/.docker",
# Never list files (e.g. ~/.gitconfig) — Grok requires directories only.
read_only = [
  "/opt/homebrew",
  "/usr/local",
]

read_write = [
  "./.devcage-data",
]

deny = [
  "**/.env",
  "**/.env.*",
  "**/local.env",
  "**/*.pem",
  "**/*.p12",
  "**/*.key",
  "**/*id_rsa*",
  "**/*id_ed25519*",
  "**/credentials.json",
  "**/service-account*.json",
  "**/secrets.yaml",
  "**/secrets.yml",
  "**/secrets.toml",
  "**/.ssh",
  "**/.ssh/**",
  "**/.aws",
  "**/.aws/**",
  "**/.gnupg",
  "**/.gnupg/**",
  "**/.kube",
  "**/.kube/**",
  "**/.docker/config.json",
  "**/.config/gcloud/**",
  "**/.netrc",
  "**/.npmrc",
  "**/.pypirc",
  "**/Library/Keychains/**",
  "**/Library/Keychains",
]
