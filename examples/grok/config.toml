# Grok permission rules for keys-first projects (model policy layer).
# Seeded by: devcage grok | devcage init-grok
#
# deny always wins over allow and over always-approve.
# Pair with .grok/sandbox.toml (kernel) + mcp-guard + secret-launcher + pkg-guard.

[permission]
deny = [
  # Secret paths
  "Read(**/.ssh/**)",
  "Read(**/.ssh)",
  "Edit(**/.ssh/**)",
  "Edit(**/.ssh)",
  "Read(**/.aws/**)",
  "Read(**/.aws)",
  "Edit(**/.aws/**)",
  "Edit(**/.aws)",
  "Read(**/.gnupg/**)",
  "Edit(**/.gnupg/**)",
  "Read(**/.env)",
  "Edit(**/.env)",
  "Read(**/.env.*)",
  "Edit(**/.env.*)",
  "Read(**/local.env)",
  "Edit(**/local.env)",
  "Read(**/*.pem)",
  "Edit(**/*.pem)",
  "Read(**/*.key)",
  "Edit(**/*.key)",
  "Read(**/credentials.json)",
  "Edit(**/credentials.json)",
  "Read(**/Library/Keychains/**)",
  "Edit(**/Library/Keychains/**)",

  # Dangerous host patterns
  "Bash(rm -rf /*)",
  "Bash(rm -rf ~*)",
  "Bash(sudo *)",
  "Bash(security *)",
  "Bash(security)",
  "Bash(ssh-add *)",
  "Bash(ssh *)",

  # Break-glass DevCage host profile (use offline/untrusted/agent instead)
  "Bash(devcage run -p host*)",
  "Bash(devcage run --profile host*)",
  "Bash(devcage shell -p host*)",
  "Bash(devcage agent --host-restricted*)",
]

allow = [
  # Project-local work
  "Bash(cargo *)",
  "Bash(git *)",
  "Bash(rg *)",
  "Bash(npm *)",
  "Bash(npx *)",
  "Bash(uvx *)",
  "Bash(make *)",
  "Bash(docker *)",
  "Bash(colima *)",

  # Deep cage (not host)
  "Bash(devcage doctor*)",
  "Bash(devcage status*)",
  "Bash(devcage limits*)",
  "Bash(devcage verify*)",
  "Bash(devcage pull*)",
  "Bash(devcage run -p offline*)",
  "Bash(devcage run -p untrusted*)",
  "Bash(devcage run -p agent*)",
  "Bash(devcage shell -p offline*)",
  "Bash(devcage shell -p untrusted*)",
  "Bash(devcage shell -p agent*)",
  "Bash(devcage stop*)",
  "Bash(devcage clean*)",
  "Bash(devcage export*)",
  "Bash(devcage logs*)",
  "Bash(devcage profile*)",
]
